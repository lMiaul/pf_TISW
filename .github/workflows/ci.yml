# .github/workflows/ci.yml
# ─────────────────────────────────────────────────────────────────────────────
# CI Pipeline — Credit Risk Predictor
# Se ejecuta en: push a main/develop + cualquier Pull Request
# Pasos: instalar dependencias → lint (ruff) → tests (pytest + coverage)
# ─────────────────────────────────────────────────────────────────────────────

name: CI — Lint & Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      # ── 1. Checkout del código ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Configurar Python ──────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ── 3. Instalar dependencias ──────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Lint con Ruff ──────────────────────────────────────────────
      - name: Lint with Ruff
        run: |
          ruff check src/ tests/ app.py --output-format=github
          ruff format src/ tests/ app.py --check

      # ── 5. Tests con pytest + cobertura ──────────────────────────────
      - name: Run tests
        run: |
          pytest tests/ \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      # ── 6. Subir reporte de cobertura a Codecov (opcional) ────────────
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: credit-risk-predictor
        continue-on-error: true   # no bloquea el CI si Codecov falla

  # ── Job de verificación de imports de Streamlit ───────────────────────
  smoke-import:
    name: Smoke — import check
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Verify all modules importable
        run: |
          python -c "
          from src.utils.session       import init_session_state
          from src.utils.preprocessing import preprocess, compute_class_distribution
          from src.utils.resampling    import apply_resampling, ALGORITHMS
          from src.utils.modeling      import train_with_cv, compute_metrics, compute_delta
          print('All modules imported successfully.')
          "
